# CS-Compose-DockerStack-v1_0.yml
# Date: 2025-08-10
# Purpose: On‑prem stack for ClearSight (frontend, backend, db, reverse proxy)

version: "3.9"

services:
  db:
    image: postgres:16
    container_name: clearsight_db
    environment:
      POSTGRES_DB: clearsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./CS-Backend-Service-v1_0
    container_name: clearsight_api
    environment:
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-changeme}
      DATABASE_URL: postgres://postgres:postgres@db:5432/clearsight
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.25-alpine
    container_name: clearsight_web
    volumes:
      - ./CS-Nginx-Config-v1_0.conf:/etc/nginx/conf.d/default.conf:ro
      - webroot:/usr/share/nginx/html
      - certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

volumes:
  dbdata:
  webroot:
  certs:

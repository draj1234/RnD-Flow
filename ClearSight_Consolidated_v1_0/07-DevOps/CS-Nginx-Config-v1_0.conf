# CS-Nginx-Config-v1_0.conf
# Reverse proxy for ClearSight (TLS termination + static hosting placeholder)

server {
  listen 80;
  server_name clearsight.local;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name clearsight.local;

  # Self-signed / internal CA certs placed via 'certs' volume
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # Security headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";

  # Frontend static (optional if you build SPA into webroot volume)
  root /usr/share/nginx/html;
  index index.html;

  location /healthz {
    return 200 "ok";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://clearsight_api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
